name: 📱 自动编译九一集英社 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # 关键修改

      - name: 安装依赖
        run: npm install

      - name: 构建 React 页面
        run: npm run build

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: 安装 Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 添加 Android 平台（如果已存在则忽略错误）
        run: npx cap add android || true

      - name: 同步 Web 产物到 Android
        run: npx cap sync

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: jiuyivault-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
